<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accesso Admin — SWOT Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --blue: #2980b9; --blue-dark: #216ea0; --blue-light: #ebf5fb;
      --gray: #7f8c8d; --gray-light: #f4f6f7;
      --dark: #2c3e50; --border: #dce1e7;
      --white: #ffffff; --red: #e74c3c;
      --shadow: 0 4px 24px rgba(0,0,0,0.1);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-box {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 44px 40px;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo .icon {
      width: 56px; height: 56px;
      background: var(--blue-light);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 14px;
    }
    .logo h1 { font-size: 1.3rem; font-weight: 700; }
    .logo p  { font-size: 0.86rem; color: var(--gray); margin-top: 4px; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gray);
      margin-bottom: 6px;
      margin-top: 18px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
      background: var(--white);
    }
    input:focus { border-color: var(--blue); }

    .error-msg {
      background: #fdf2f0;
      border: 1px solid #f5c6c0;
      color: var(--red);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.86rem;
      margin-top: 16px;
      display: none;
    }

    .btn-login {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-login:hover     { background: var(--blue-dark); }
    .btn-login:disabled  { background: var(--gray); cursor: not-allowed; }

    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.83rem;
      color: var(--gray);
    }
    .back-link a { color: var(--gray); }

    @media (max-width: 440px) {
      .login-box { padding: 32px 24px; }
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="logo">
    <div class="icon">🔐</div>
    <h1>Area Amministratore</h1>
    <p>Accedi per visualizzare la dashboard</p>
  </div>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="admin@esempio.it"
         onkeydown="if(event.key==='Enter') login()" autocomplete="email" />

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="••••••••"
         onkeydown="if(event.key==='Enter') login()" autocomplete="current-password" />

  <div class="error-msg" id="error-msg"></div>

  <button class="btn-login" id="btn-login" onclick="login()">Accedi</button>

  <div class="back-link">
    <a href="index.html">← Torna al modulo operatori</a>
  </div>
</div>

<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Se già loggato, vai diretto alla dashboard
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) window.location.href = 'admin.html';
})();

async function login() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errDiv   = document.getElementById('error-msg');
  const btn      = document.getElementById('btn-login');

  errDiv.style.display = 'none';

  if (!email || !password) {
    errDiv.textContent = 'Inserisci email e password.';
    errDiv.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Accesso in corso…';

  const { error } = await db.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = 'Accedi';

  if (error) {
    errDiv.textContent = 'Credenziali non valide. Riprova.';
    errDiv.style.display = 'block';
    return;
  }

  window.location.href = 'admin.html';
}
</script>
</body>
</html>
