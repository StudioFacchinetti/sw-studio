<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f0f2f5" />
  <title>Accesso Admin — SW Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --blue: #2980b9; --blue-dark: #216ea0; --blue-light: #ebf5fb;
      --gray: #7f8c8d; --gray-light: #f4f6f7;
      --dark: #2c3e50; --border: #dce1e7;
      --white: #fff;   --red: #e74c3c;
      --shadow: 0 4px 24px rgba(0,0,0,0.1);
      --radius: 16px;  --touch: 48px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5; color: var(--dark);
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: clamp(16px, 4vw, 32px);
      padding-top: calc(clamp(16px, 4vw, 32px) + env(safe-area-inset-top));
      padding-bottom: calc(clamp(16px, 4vw, 32px) + env(safe-area-inset-bottom));
    }

    .login-box {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(28px, 6vw, 48px) clamp(24px, 6vw, 44px);
      width: 100%; max-width: 420px;
    }

    .logo { text-align: center; margin-bottom: clamp(24px, 5vw, 36px); }
    .logo .icon {
      width: clamp(52px, 12vw, 60px); height: clamp(52px, 12vw, 60px);
      background: var(--blue-light); border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(1.4rem, 5vw, 1.7rem);
      margin: 0 auto clamp(12px, 3vw, 16px);
    }
    .logo h1 { font-size: clamp(1.1rem, 4vw, 1.3rem); font-weight: 700; }
    .logo p  { font-size: clamp(0.8rem, 3vw, 0.86rem); color: var(--gray); margin-top: 4px; }

    label {
      display: block; font-size: clamp(0.8rem, 3vw, 0.85rem);
      font-weight: 600; color: var(--gray);
      margin-bottom: 6px; margin-top: clamp(14px, 3vw, 18px);
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: clamp(12px, 3vw, 14px) clamp(14px, 3vw, 16px);
      border: 1.5px solid var(--border); border-radius: 10px;
      /* font-size >= 16px evita zoom automatico su iOS */
      font-size: max(16px, 0.95rem);
      outline: none; font-family: inherit;
      transition: border-color 0.2s; background: var(--white);
      min-height: var(--touch);
    }
    input:focus { border-color: var(--blue); }

    .error-msg {
      background: #fdf2f0; border: 1px solid #f5c6c0; color: var(--red);
      border-radius: 8px; padding: 11px 14px;
      font-size: clamp(0.82rem, 3vw, 0.86rem); margin-top: 14px; display: none;
    }

    .btn-login {
      width: 100%; margin-top: clamp(20px, 4vw, 28px);
      padding: clamp(14px, 3.5vw, 16px);
      background: var(--blue); color: white;
      border: none; border-radius: 12px;
      font-size: clamp(0.95rem, 3.5vw, 1rem); font-weight: 700; cursor: pointer;
      transition: background 0.2s; min-height: var(--touch);
      touch-action: manipulation;
    }
    .btn-login:active   { background: var(--blue-dark); }
    .btn-login:disabled { background: var(--gray); cursor: not-allowed; }

    .back-link {
      text-align: center; margin-top: clamp(14px, 3vw, 20px);
      font-size: clamp(0.78rem, 3vw, 0.83rem); color: var(--gray);
    }
    .back-link a { color: var(--gray); padding: 8px; display: inline-block; }
  </style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <div class="icon">🔐</div>
    <h1>Area Amministratore</h1>
    <p>Accedi per visualizzare la dashboard</p>
  </div>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="admin@esempio.it"
         onkeydown="if(event.key==='Enter') login()"
         autocomplete="email" inputmode="email" />

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="••••••••"
         onkeydown="if(event.key==='Enter') login()"
         autocomplete="current-password" />

  <div class="error-msg" id="error-msg"></div>

  <button class="btn-login" id="btn-login" onclick="login()">Accedi</button>

  <div class="back-link">
    <a href="index.html">← Torna al modulo operatori</a>
  </div>
</div>

<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) window.location.href = 'admin.html';
})();

async function login() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errDiv   = document.getElementById('error-msg');
  const btn      = document.getElementById('btn-login');
  errDiv.style.display = 'none';
  if (!email || !password) {
    errDiv.textContent='Inserisci email e password.'; errDiv.style.display='block'; return;
  }
  btn.disabled=true; btn.textContent='Accesso in corso…';
  const { error } = await db.auth.signInWithPassword({ email, password });
  btn.disabled=false; btn.textContent='Accedi';
  if (error) {
    errDiv.textContent='Credenziali non valide. Riprova.'; errDiv.style.display='block'; return;
  }
  window.location.href = 'admin.html';
}
</script>
</body>
</html>
