<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff" />
  <title>Admin — SW Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --green: #2ecc71; --green-light: #eafaf1; --green-dark: #1a8a4a;
      --red: #e74c3c;   --red-light: #fdf2f0;   --red-dark: #b03a2e;
      --blue: #2980b9;  --blue-light: #ebf5fb;  --blue-dark: #216ea0;
      --gray: #7f8c8d;  --gray-light: #f4f6f7;
      --dark: #2c3e50;  --border: #dce1e7;
      --white: #fff;    --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --radius: 10px;   --touch: 48px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5; color: var(--dark); min-height: 100vh; min-height: 100dvh;
    }

    /* ── NAV ── */
    nav {
      background: var(--white); border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100;
      padding-top: env(safe-area-inset-top);
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 0 clamp(12px, 3vw, 24px);
      height: 56px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .nav-logo {
      font-size: clamp(0.95rem, 3.5vw, 1.15rem); font-weight: 700;
      white-space: nowrap; flex-shrink: 0;
    }
    .nav-logo span { color: var(--blue); }
    .nav-logo small {
      margin-left: 8px; font-size: 0.68rem; font-weight: 600;
      background: var(--blue-light); color: var(--blue);
      padding: 2px 7px; border-radius: 8px;
    }

    /* ── TABS ── */
    .nav-center { display: flex; align-items: center; gap: 4px; flex: 1; justify-content: center; }
    .nav-tab {
      padding: 0 clamp(10px, 2.5vw, 18px);
      height: 38px;
      border: none; border-radius: 8px;
      background: transparent; color: var(--gray);
      font-size: clamp(0.78rem, 2.8vw, 0.9rem); font-weight: 500;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
      touch-action: manipulation;
    }
    .nav-tab:hover  { background: var(--gray-light); color: var(--dark); }
    .nav-tab.active { background: var(--blue-light); color: var(--blue); font-weight: 700; }

    .btn-logout {
      padding: 0 clamp(10px, 2.5vw, 16px);
      height: 36px;
      background: var(--gray-light); border: 1px solid var(--border); border-radius: 8px;
      color: var(--gray); font-size: clamp(0.78rem, 2.5vw, 0.84rem); font-weight: 600;
      cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
      touch-action: manipulation;
    }
    .btn-logout:hover,
    .btn-logout:active { background: var(--red-light); color: var(--red-dark); border-color: var(--red); }

    /* ── PAGES ── */
    .tab-page { display: none; max-width: 1200px; margin: 0 auto; padding: clamp(16px,3vw,28px) clamp(12px,3vw,20px); }
    .tab-page.active { display: block; }

    /* ── LOADING ── */
    .loading { text-align: center; padding: 80px 20px; color: var(--gray); }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CARDS ── */
    .card {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: clamp(16px,3vw,24px); margin-bottom: clamp(14px,3vw,20px);
    }
    .card-title { font-size: clamp(0.9rem,3vw,1rem); font-weight: 700; margin-bottom: 16px; }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: clamp(8px,2vw,10px); margin-bottom: clamp(16px,3vw,24px);
    }
    .toolbar label { font-size: 0.82rem; font-weight: 600; color: var(--gray); }
    .toolbar select, .toolbar input[type="date"] {
      padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: clamp(0.82rem,3vw,0.9rem); background: var(--white);
      outline: none; color: var(--dark); min-height: var(--touch);
    }
    .toolbar select:focus, .toolbar input:focus { border-color: var(--blue); }
    .date-range { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-export {
      padding: 10px clamp(14px,3vw,20px);
      background: var(--blue-light); color: var(--blue);
      border: 1.5px solid var(--blue); border-radius: 8px;
      font-size: clamp(0.8rem,3vw,0.86rem); font-weight: 700; cursor: pointer;
      transition: background 0.2s; min-height: var(--touch);
      touch-action: manipulation;
    }
    .btn-export:active { background: #d1eaf7; }

    /* ── STATS ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px,2vw,16px); margin-bottom: clamp(14px,3vw,24px);
    }
    .stat-box {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: clamp(14px,3vw,22px) clamp(10px,2vw,20px);
      text-align: center;
    }
    .stat-box .num { font-size: clamp(1.6rem,5vw,2.4rem); font-weight: 800; line-height: 1; }
    .stat-box .lbl { font-size: clamp(0.68rem,2.2vw,0.8rem); color: var(--gray); margin-top: 6px; line-height: 1.3; }
    .stat-box.blue  .num { color: var(--blue); }
    .stat-box.green .num { color: var(--green); }
    .stat-box.red   .num { color: var(--red); }

    /* ── CHARTS ── */
    .charts-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(12px,2vw,20px); margin-bottom: clamp(14px,3vw,24px);
    }
    .chart-card {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: clamp(16px,3vw,24px);
      min-width: 0; /* evita overflow in grid */
    }
    .chart-card h3 {
      font-size: clamp(0.82rem,2.8vw,0.93rem); font-weight: 700;
      margin-bottom: clamp(12px,2vw,16px);
    }
    .chart-card h3.green { color: var(--green-dark); }
    .chart-card h3.red   { color: var(--red-dark); }
    .empty-chart {
      height: 140px; display: flex; align-items: center;
      justify-content: center; color: var(--gray); font-size: 0.86rem;
    }

    /* ── TABLE — desktop ── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: clamp(0.78rem,2.5vw,0.86rem); }
    th {
      text-align: left; padding: 10px 12px; font-weight: 700;
      color: var(--gray); border-bottom: 2px solid var(--border); white-space: nowrap;
    }
    td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--gray-light); }

    .badge {
      display: inline-block; padding: 3px 9px; border-radius: 12px;
      font-size: clamp(0.7rem,2.2vw,0.77rem); font-weight: 600; margin: 2px 2px 2px 0;
    }
    .badge-green { background: var(--green-light); color: var(--green-dark); }
    .badge-red   { background: var(--red-light);   color: var(--red-dark); }

    .btn-del {
      background: none; border: none; color: var(--red-dark);
      cursor: pointer; opacity: 0.4; transition: opacity 0.2s;
      padding: 6px 8px; font-size: 1rem; min-height: var(--touch);
      min-width: var(--touch); touch-action: manipulation;
    }
    .btn-del:hover, .btn-del:active { opacity: 1; }

    /* ── TABLE — card view su mobile ── */
    @media (max-width: 640px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr {
        background: var(--white); border: 1px solid var(--border);
        border-radius: 10px; margin-bottom: 12px; padding: 4px 0;
        box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      }
      tr:hover td { background: transparent; }
      td {
        border-bottom: 1px solid var(--gray-light);
        padding: 9px 14px;
        display: flex; align-items: flex-start; gap: 8px;
      }
      td:last-child { border-bottom: none; }
      td::before {
        content: attr(data-label);
        font-weight: 700; color: var(--gray);
        font-size: 0.72rem; min-width: 90px; flex-shrink: 0; padding-top: 2px;
        text-transform: uppercase; letter-spacing: 0.04em;
      }
      td[data-label=""]::before { display: none; }
      td[data-label=""] { justify-content: flex-end; padding-top: 6px; }
    }

    .empty-table {
      text-align: center; padding: clamp(32px,5vw,48px) 20px;
      color: var(--gray); font-size: 0.9rem;
    }
    .empty-table .icon { font-size: 2.2rem; margin-bottom: 10px; }

    /* ── CATEGORIE ── */
    .cat-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(12px,2vw,20px);
    }
    .cat-column {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: clamp(16px,3vw,24px);
    }
    .cat-column h3 {
      font-size: clamp(0.88rem,3vw,0.95rem); font-weight: 700;
      margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
    }
    .cat-column h3.green { color: var(--green-dark); }
    .cat-column h3.red   { color: var(--red-dark); }
    .cat-count {
      font-size: 0.75rem; font-weight: 600;
      background: var(--gray-light); color: var(--gray);
      padding: 2px 8px; border-radius: 10px; margin-left: auto;
    }
    .cat-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
    .cat-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--border);
      font-size: clamp(0.82rem,2.8vw,0.88rem); gap: 8px; min-height: var(--touch);
    }
    .cat-item span { flex: 1; line-height: 1.3; }
    .cat-item.green-item { border-color: #c8f0da; background: var(--green-light); }
    .cat-item.red-item   { border-color: #f5c6c0; background: var(--red-light); }
    .btn-cat-del {
      background: none; border: none; color: var(--red-dark);
      cursor: pointer; font-size: 0.9rem; opacity: 0.35;
      transition: opacity 0.2s; padding: 6px 8px;
      min-width: var(--touch); min-height: var(--touch);
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .btn-cat-del:hover, .btn-cat-del:active { opacity: 1; }

    .cat-add-row { display: flex; gap: 8px; }
    .cat-add-input {
      flex: 1; min-width: 0; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: max(16px, 0.88rem); outline: none; font-family: inherit;
      transition: border-color 0.2s; min-height: var(--touch);
    }
    .cat-add-btn {
      padding: 0 clamp(12px,3vw,16px); border: none; border-radius: 8px;
      font-size: clamp(0.78rem,2.5vw,0.84rem); font-weight: 700;
      cursor: pointer; color: white; white-space: nowrap;
      min-height: var(--touch); touch-action: manipulation;
    }
    .green-section .cat-add-input:focus { border-color: var(--green); }
    .green-section .cat-add-btn { background: var(--green); }
    .green-section .cat-add-btn:active { background: #27ae60; }
    .red-section   .cat-add-input:focus { border-color: var(--red); }
    .red-section   .cat-add-btn { background: var(--red); }
    .red-section   .cat-add-btn:active { background: #c0392b; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--dark); color: white;
      padding: 13px clamp(18px,4vw,26px); border-radius: 30px;
      font-size: clamp(0.85rem,3vw,0.92rem); font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      opacity: 0; transition: all 0.3s;
      pointer-events: none; z-index: 9999;
      max-width: calc(100vw - 32px); text-align: center;
    }
    .toast.show    { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--green); }
    .toast.error   { background: var(--red); }

    /* ── RESPONSIVE BREAKPOINTS ── */
    @media (max-width: 640px) {
      .charts-row    { grid-template-columns: 1fr; }
      .cat-grid      { grid-template-columns: 1fr; }
      .stats-row .lbl { font-size: 0.65rem; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .btn-export { width: 100%; }
      .date-range { flex-direction: column; align-items: stretch; }
    }

    @media (max-width: 420px) {
      .stats-row { grid-template-columns: 1fr; }
      .cat-add-row { flex-direction: column; }
      .cat-add-btn { width: 100%; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-logo">SW <span>Studio</span><small>ADMIN</small></div>
    <div class="nav-center">
      <button class="nav-tab active" onclick="switchTab('dashboard')">📊 Dashboard</button>
      <button class="nav-tab"        onclick="switchTab('categorie')">🏷️ Categorie</button>
    </div>
    <button class="btn-logout" onclick="logout()">Esci</button>
  </div>
</nav>

<!-- DASHBOARD -->
<div class="tab-page active" id="tab-dashboard">
  <div class="loading" id="loading">
    <div class="spinner"></div>Caricamento…
  </div>
</div>

<!-- CATEGORIE -->
<div class="tab-page" id="tab-categorie">
  <div class="cat-grid">
    <div class="cat-column green-section">
      <h3 class="green">🟢 Punti di Forza <span class="cat-count" id="count-strength">0</span></h3>
      <div class="cat-list" id="cat-list-strength"></div>
      <div class="cat-add-row">
        <input type="text" class="cat-add-input" id="cat-input-strength"
               placeholder="Nuova categoria…"
               onkeydown="if(event.key==='Enter'){event.preventDefault();addCategory('strength')}" />
        <button class="cat-add-btn" onclick="addCategory('strength')">+ Aggiungi</button>
      </div>
    </div>
    <div class="cat-column red-section">
      <h3 class="red">🔴 Punti di Debolezza <span class="cat-count" id="count-weakness">0</span></h3>
      <div class="cat-list" id="cat-list-weakness"></div>
      <div class="cat-add-row">
        <input type="text" class="cat-add-input" id="cat-input-weakness"
               placeholder="Nuova categoria…"
               onkeydown="if(event.key==='Enter'){event.preventDefault();addCategory('weakness')}" />
        <button class="cat-add-btn" onclick="addCategory('weakness')">+ Aggiungi</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allEntries = [], allCategories = [], chartS = null, chartW = null;

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  await Promise.all([loadEntries(), loadCategories()]);
  buildDashboard();
  renderCategories();
})();

async function logout() { await db.auth.signOut(); window.location.href = 'login.html'; }

function switchTab(name) {
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.nav-tab')[name==='dashboard'?0:1].classList.add('active');
}

async function loadEntries() {
  const { data, error } = await db.from('entries').select('*').order('created_at',{ascending:false});
  if (!error) allEntries = data || [];
}
async function loadCategories() {
  const { data, error } = await db.from('categories').select('*').order('sort_order',{ascending:true});
  if (!error) allCategories = data || [];
}

/* ── DASHBOARD ── */
function buildDashboard() {
  document.getElementById('loading').remove();
  document.getElementById('tab-dashboard').innerHTML = `
    <div class="toolbar">
      <label>Periodo:</label>
      <select id="filter-period" onchange="onFilterChange()">
        <option value="all">Tutto</option>
        <option value="7">Ultimi 7 giorni</option>
        <option value="30">Ultimi 30 giorni</option>
        <option value="90">Ultimi 3 mesi</option>
        <option value="custom">Intervallo personalizzato</option>
      </select>
      <div class="date-range" id="date-range" style="display:none;">
        <input type="date" id="filter-from" onchange="onFilterChange()" />
        <span style="color:var(--gray);flex-shrink:0;">→</span>
        <input type="date" id="filter-to"   onchange="onFilterChange()" />
      </div>
      <button class="btn-export" onclick="exportCSV()">↓ Esporta CSV</button>
    </div>

    <div class="stats-row">
      <div class="stat-box blue" ><div class="num" id="stat-tot">0</div><div class="lbl">Segnalazioni totali</div></div>
      <div class="stat-box green"><div class="num" id="stat-s">0</div>  <div class="lbl">Punti di forza</div></div>
      <div class="stat-box red"  ><div class="num" id="stat-w">0</div>  <div class="lbl">Punti di debolezza</div></div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <h3 class="green">🟢 Top Punti di Forza</h3>
        <canvas id="chart-s"></canvas>
        <div id="chart-s-empty" class="empty-chart" style="display:none;">Nessun dato</div>
      </div>
      <div class="chart-card">
        <h3 class="red">🔴 Top Punti di Debolezza</h3>
        <canvas id="chart-w"></canvas>
        <div id="chart-w-empty" class="empty-chart" style="display:none;">Nessun dato</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📋 Storico Segnalazioni</div>
      <div class="table-wrap">
        <table id="log-table">
          <thead><tr>
            <th>Data e ora</th><th>Punti di Forza</th>
            <th>Punti di Debolezza</th><th>Note</th><th></th>
          </tr></thead>
          <tbody id="log-tbody"></tbody>
        </table>
        <div id="log-empty" class="empty-table" style="display:none;">
          <div class="icon">📋</div>
          <div>Nessuna segnalazione nel periodo selezionato.</div>
        </div>
      </div>
    </div>`;
  renderDashboard();
}

function onFilterChange() {
  const p = document.getElementById('filter-period').value;
  document.getElementById('date-range').style.display = p==='custom' ? 'flex' : 'none';
  renderDashboard();
}

function getFiltered() {
  const p = document.getElementById('filter-period')?.value || 'all';
  if (p === 'all') return allEntries;
  if (p === 'custom') {
    const from = document.getElementById('filter-from').value;
    const to   = document.getElementById('filter-to').value;
    return allEntries.filter(e => {
      const d = e.created_at.slice(0,10);
      return (!from || d >= from) && (!to || d <= to);
    });
  }
  const cut = new Date(); cut.setDate(cut.getDate() - parseInt(p));
  return allEntries.filter(e => new Date(e.created_at) >= cut);
}

function renderDashboard() {
  const e = getFiltered();
  document.getElementById('stat-tot').textContent = e.length;
  document.getElementById('stat-s').textContent   = e.reduce((n,r)=>n+(r.strengths||[]).length,0);
  document.getElementById('stat-w').textContent   = e.reduce((n,r)=>n+(r.weaknesses||[]).length,0);
  renderChart('chart-s','chart-s-empty', cnt(e,'strengths'),  'rgba(46,204,113,0.7)', 'rgba(46,204,113,1)','S');
  renderChart('chart-w','chart-w-empty', cnt(e,'weaknesses'), 'rgba(231,76,60,0.65)', 'rgba(231,76,60,1)', 'W');
  renderTable(e);
}

function cnt(entries, field) {
  const m = {};
  entries.forEach(e => (e[field]||[]).forEach(x => { m[x]=(m[x]||0)+1; }));
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function renderChart(cid, eid, data, bg, border, key) {
  const canvas = document.getElementById(cid), empty = document.getElementById(eid);
  const top = data.slice(0,8);
  if (!top.length) { canvas.style.display='none'; empty.style.display='flex'; return; }
  canvas.style.display='block'; empty.style.display='none';
  if (key==='S' && chartS) { chartS.destroy(); chartS=null; }
  if (key==='W' && chartW) { chartW.destroy(); chartW=null; }
  const ch = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: top.map(([k])=>k.length>28?k.slice(0,26)+'…':k),
      datasets:[{data:top.map(([,v])=>v),backgroundColor:bg,borderColor:border,borderWidth:1.5,borderRadius:6}]
    },
    options:{
      indexAxis:'y', responsive:true,
      plugins:{legend:{display:false}},
      scales:{
        x:{beginAtZero:true,ticks:{precision:0},grid:{color:'#f0f2f5'}},
        y:{grid:{display:false},ticks:{font:{size:11}}}
      }
    }
  });
  if (key==='S') chartS=ch; else chartW=ch;
}

function renderTable(entries) {
  const tbody = document.getElementById('log-tbody');
  const empty = document.getElementById('log-empty');
  if (!entries.length) { tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  tbody.innerHTML = entries.map(e => `
    <tr>
      <td data-label="Data">${fmtDate(e.created_at)}</td>
      <td data-label="Punti di Forza">${(e.strengths||[]).map(s=>`<span class="badge badge-green">${esc(s)}</span>`).join('')||dash()}</td>
      <td data-label="Punti Debolezza">${(e.weaknesses||[]).map(w=>`<span class="badge badge-red">${esc(w)}</span>`).join('')||dash()}</td>
      <td data-label="Note" style="font-size:0.84rem;color:var(--gray);max-width:180px;">${esc(e.note||'')}</td>
      <td data-label=""><button class="btn-del" onclick="deleteEntry('${e.id}')">🗑</button></td>
    </tr>`).join('');
}

async function deleteEntry(id) {
  if (!confirm('Eliminare questa segnalazione?')) return;
  const { error } = await db.from('entries').delete().eq('id',id);
  if (error) { showToast('Errore eliminazione.','error'); return; }
  allEntries = allEntries.filter(e=>String(e.id)!==String(id));
  renderDashboard(); showToast('Segnalazione eliminata.','success');
}

function exportCSV() {
  const e = getFiltered();
  if (!e.length) { showToast('Nessun dato da esportare.','error'); return; }
  const rows = [['Data e ora','Punti di Forza','Punti di Debolezza','Note']];
  e.forEach(r=>rows.push([fmtDate(r.created_at),(r.strengths||[]).join(' | '),(r.weaknesses||[]).join(' | '),r.note||'']));
  const csv  = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`sw-studio_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); showToast('CSV esportato!','success');
}

/* ── CATEGORIE ── */
function renderCategories() { renderCatList('strength'); renderCatList('weakness'); }

function renderCatList(type) {
  const items = allCategories.filter(c=>c.type===type);
  document.getElementById('count-'+type).textContent = items.length;
  const list = document.getElementById('cat-list-'+type);
  if (!items.length) {
    list.innerHTML='<div style="color:var(--gray);font-size:0.85rem;padding:8px 0;">Nessuna categoria. Aggiungine una.</div>'; return;
  }
  const cls = type==='strength'?'green-item':'red-item';
  list.innerHTML = items.map(c=>`
    <div class="cat-item ${cls}">
      <span>${esc(c.label)}</span>
      <button class="btn-cat-del" onclick="deleteCategory(${c.id},'${type}')">✕</button>
    </div>`).join('');
}

async function addCategory(type) {
  const inp = document.getElementById('cat-input-'+type);
  const val = inp.value.trim();
  if (!val) return;
  if (allCategories.some(c=>c.type===type&&c.label.toLowerCase()===val.toLowerCase())) {
    showToast('Categoria già esistente.','error'); return;
  }
  const nextOrder = allCategories.filter(c=>c.type===type).length+1;
  const { data, error } = await db.from('categories').insert({type,label:val,sort_order:nextOrder}).select().single();
  if (error) { showToast('Errore aggiunta.','error'); return; }
  allCategories.push(data); inp.value='';
  renderCatList(type); showToast('Categoria aggiunta!','success');
}

async function deleteCategory(id, type) {
  const cat = allCategories.find(c=>c.id===id);
  if (!confirm(`Eliminare "${cat?.label}"?`)) return;
  const { error } = await db.from('categories').delete().eq('id',id);
  if (error) { showToast('Errore eliminazione.','error'); return; }
  allCategories = allCategories.filter(c=>c.id!==id);
  renderCatList(type); showToast('Categoria eliminata.','success');
}

/* ── UTILS ── */
function fmtDate(iso) {
  const d=new Date(iso);
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})
    +' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dash(){return '<span style="color:var(--gray);font-size:0.82rem;">—</span>';}
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2800);
}
</script>
