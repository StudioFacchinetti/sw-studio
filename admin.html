<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — SW Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --green: #2ecc71; --green-light: #eafaf1; --green-dark: #1a8a4a;
      --red: #e74c3c;   --red-light: #fdf2f0;   --red-dark: #b03a2e;
      --blue: #2980b9;  --blue-light: #ebf5fb;  --blue-dark: #216ea0;
      --gray: #7f8c8d;  --gray-light: #f4f6f7;
      --dark: #2c3e50;  --border: #dce1e7;
      --white: #fff;    --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5; color: var(--dark); min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      background: var(--white); border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-size: 1.15rem; font-weight: 700; }
    .nav-logo span { color: var(--blue); }
    .nav-logo small {
      margin-left: 10px; font-size: 0.72rem; font-weight: 600;
      background: var(--blue-light); color: var(--blue);
      padding: 2px 8px; border-radius: 8px;
    }
    .nav-right { display: flex; align-items: center; gap: 8px; }

    /* ── TABS ── */
    .nav-tabs { display: flex; gap: 4px; }
    .nav-tab {
      padding: 8px 18px; border: none; border-radius: 8px;
      background: transparent; color: var(--gray);
      font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .nav-tab:hover  { background: var(--gray-light); color: var(--dark); }
    .nav-tab.active { background: var(--blue-light); color: var(--blue); font-weight: 700; }

    .btn-logout {
      padding: 8px 16px; background: var(--gray-light);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--gray); font-size: 0.84rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { background: var(--red-light); color: var(--red-dark); border-color: var(--red); }

    /* ── PAGES ── */
    .tab-page { display: none; max-width: 1200px; margin: 0 auto; padding: 28px 20px; }
    .tab-page.active { display: block; }

    /* ── LOADING ── */
    .loading {
      text-align: center; padding: 80px 20px;
      color: var(--gray); font-size: 1rem;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CARDS ── */
    .card {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px;
    }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 18px; }

    /* ── DASHBOARD TOOLBAR ── */
    .toolbar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
      margin-bottom: 24px;
    }
    .toolbar label { font-size: 0.85rem; font-weight: 600; color: var(--gray); }
    .toolbar select, .toolbar input[type="date"] {
      padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 0.9rem; background: var(--white); outline: none; color: var(--dark);
    }
    .toolbar select:focus, .toolbar input:focus { border-color: var(--blue); }
    .date-range { display: flex; align-items: center; gap: 8px; }
    .btn-export {
      margin-left: auto; padding: 9px 20px;
      background: var(--blue-light); color: var(--blue);
      border: 1.5px solid var(--blue); border-radius: 8px;
      font-size: 0.86rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    .btn-export:hover { background: #d1eaf7; }

    /* ── STATS ── */
    .stats-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-box {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 22px 20px; text-align: center;
    }
    .stat-box .num { font-size: 2.4rem; font-weight: 800; line-height: 1; }
    .stat-box .lbl { font-size: 0.8rem; color: var(--gray); margin-top: 6px; }
    .stat-box.blue  .num { color: var(--blue); }
    .stat-box.green .num { color: var(--green); }
    .stat-box.red   .num { color: var(--red); }

    /* ── CHARTS ── */
    .charts-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 20px; margin-bottom: 24px;
    }
    @media (max-width: 720px) { .charts-row { grid-template-columns: 1fr; } }
    .chart-card {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 24px;
    }
    .chart-card h3 { font-size: 0.93rem; font-weight: 700; margin-bottom: 16px; }
    .chart-card h3.green { color: var(--green-dark); }
    .chart-card h3.red   { color: var(--red-dark); }
    .empty-chart {
      height: 160px; display: flex; align-items: center;
      justify-content: center; color: var(--gray); font-size: 0.88rem;
    }

    /* ── TABLE ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th {
      text-align: left; padding: 10px 14px; font-weight: 700;
      color: var(--gray); border-bottom: 2px solid var(--border); white-space: nowrap;
    }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--gray-light); }

    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 12px;
      font-size: 0.77rem; font-weight: 600; margin: 2px 2px 2px 0;
    }
    .badge-green { background: var(--green-light); color: var(--green-dark); }
    .badge-red   { background: var(--red-light);   color: var(--red-dark); }
    .btn-del {
      background: none; border: none; color: #c0392b;
      cursor: pointer; font-size: 1.05rem; opacity: 0.45;
      transition: opacity 0.2s; padding: 2px 6px;
    }
    .btn-del:hover { opacity: 1; }
    .empty-table {
      text-align: center; padding: 48px 20px;
      color: var(--gray); font-size: 0.9rem;
    }
    .empty-table .icon { font-size: 2.2rem; margin-bottom: 10px; }

    /* ── CATEGORIE ── */
    .cat-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    @media (max-width: 640px) { .cat-grid { grid-template-columns: 1fr; } }

    .cat-column {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 24px;
    }
    .cat-column h3 {
      font-size: 0.95rem; font-weight: 700; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .cat-column h3.green { color: var(--green-dark); }
    .cat-column h3.red   { color: var(--red-dark); }

    .cat-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; min-height: 40px; }
    .cat-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; border-radius: 8px; border: 1.5px solid var(--border);
      background: var(--white); font-size: 0.88rem; gap: 8px;
    }
    .cat-item span { flex: 1; }
    .cat-item .btn-cat-del {
      background: none; border: none; color: #c0392b;
      cursor: pointer; font-size: 0.9rem; opacity: 0.4;
      transition: opacity 0.2s; padding: 2px 4px; flex-shrink: 0;
    }
    .cat-item .btn-cat-del:hover { opacity: 1; }
    .cat-item.green-item { border-color: #c8f0da; background: var(--green-light); }
    .cat-item.red-item   { border-color: #f5c6c0; background: var(--red-light); }

    .cat-add-row { display: flex; gap: 8px; }
    .cat-add-input {
      flex: 1; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 0.88rem; outline: none; font-family: inherit;
      transition: border-color 0.2s;
    }
    .cat-add-btn {
      padding: 10px 16px; border: none; border-radius: 8px;
      font-size: 0.84rem; font-weight: 700; cursor: pointer; color: white;
      white-space: nowrap; transition: opacity 0.2s;
    }
    .cat-add-btn:active { opacity: 0.8; }
    .green-section .cat-add-input:focus { border-color: var(--green); }
    .green-section .cat-add-btn { background: var(--green); }
    .red-section   .cat-add-input:focus { border-color: var(--red); }
    .red-section   .cat-add-btn { background: var(--red); }

    .cat-count {
      font-size: 0.78rem; font-weight: 600;
      background: var(--gray-light); color: var(--gray);
      padding: 2px 8px; border-radius: 10px; margin-left: auto;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--dark); color: white;
      padding: 13px 26px; border-radius: 30px;
      font-size: 0.92rem; font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      opacity: 0; transition: all 0.3s;
      pointer-events: none; z-index: 9999;
    }
    .toast.show    { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--green); }
    .toast.error   { background: var(--red); }

    @media (max-width: 600px) {
      .toolbar { flex-direction: column; align-items: stretch; }
      .btn-export { margin-left: 0; }
      .nav-tabs .nav-tab { padding: 8px 12px; font-size: 0.82rem; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <div class="nav-logo">SW <span>Studio</span> <small>ADMIN</small></div>
    <div class="nav-right">
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('dashboard')">📊 Dashboard</button>
        <button class="nav-tab"        onclick="switchTab('categorie')">🏷️ Categorie</button>
      </div>
      <button class="btn-logout" onclick="logout()">Esci</button>
    </div>
  </div>
</nav>

<!-- ══ DASHBOARD TAB ══ -->
<div class="tab-page active" id="tab-dashboard">
  <div class="loading" id="loading">
    <div class="spinner"></div>Caricamento…
  </div>
</div>

<!-- ══ CATEGORIE TAB ══ -->
<div class="tab-page" id="tab-categorie">
  <div class="cat-grid">

    <!-- FORZA -->
    <div class="cat-column green-section">
      <h3 class="green">
        🟢 Punti di Forza
        <span class="cat-count" id="count-strength">0</span>
      </h3>
      <div class="cat-list" id="cat-list-strength"></div>
      <div class="cat-add-row">
        <input type="text" class="cat-add-input" id="cat-input-strength"
               placeholder="Nuova categoria…"
               onkeydown="if(event.key==='Enter'){event.preventDefault();addCategory('strength')}" />
        <button class="cat-add-btn" onclick="addCategory('strength')">+ Aggiungi</button>
      </div>
    </div>

    <!-- DEBOLEZZA -->
    <div class="cat-column red-section">
      <h3 class="red">
        🔴 Punti di Debolezza
        <span class="cat-count" id="count-weakness">0</span>
      </h3>
      <div class="cat-list" id="cat-list-weakness"></div>
      <div class="cat-add-row">
        <input type="text" class="cat-add-input" id="cat-input-weakness"
               placeholder="Nuova categoria…"
               onkeydown="if(event.key==='Enter'){event.preventDefault();addCategory('weakness')}" />
        <button class="cat-add-btn" onclick="addCategory('weakness')">+ Aggiungi</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allEntries    = [];
let allCategories = [];
let chartS = null, chartW = null;

// ─── AUTH GUARD ───────────────────────────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  await Promise.all([loadEntries(), loadCategories()]);
  buildDashboard();
  renderCategories();
})();

async function logout() {
  await db.auth.signOut();
  window.location.href = 'login.html';
}

// ─── TAB SWITCH ───────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  const idx = name === 'dashboard' ? 0 : 1;
  document.querySelectorAll('.nav-tab')[idx].classList.add('active');
}

// ─── DATA ─────────────────────────────────────────────────────
async function loadEntries() {
  const { data, error } = await db.from('entries').select('*').order('created_at', { ascending: false });
  if (!error) allEntries = data || [];
}
async function loadCategories() {
  const { data, error } = await db.from('categories').select('*').order('sort_order', { ascending: true });
  if (!error) allCategories = data || [];
}

// ─── BUILD DASHBOARD HTML ─────────────────────────────────────
function buildDashboard() {
  document.getElementById('loading').remove();
  const page = document.getElementById('tab-dashboard');
  page.innerHTML = `
    <div class="toolbar">
      <label>Periodo:</label>
      <select id="filter-period" onchange="onFilterChange()">
        <option value="all">Tutto</option>
        <option value="7">Ultimi 7 giorni</option>
        <option value="30">Ultimi 30 giorni</option>
        <option value="90">Ultimi 3 mesi</option>
        <option value="custom">Intervallo personalizzato</option>
      </select>
      <div class="date-range" id="date-range" style="display:none;">
        <input type="date" id="filter-from" onchange="onFilterChange()" />
        <span style="color:var(--gray)">→</span>
        <input type="date" id="filter-to"   onchange="onFilterChange()" />
      </div>
      <button class="btn-export" onclick="exportCSV()">↓ Esporta CSV</button>
    </div>

    <div class="stats-row">
      <div class="stat-box blue" ><div class="num" id="stat-tot">0</div><div class="lbl">Segnalazioni totali</div></div>
      <div class="stat-box green"><div class="num" id="stat-s">0</div>  <div class="lbl">Punti di forza registrati</div></div>
      <div class="stat-box red"  ><div class="num" id="stat-w">0</div>  <div class="lbl">Punti di debolezza registrati</div></div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <h3 class="green">🟢 Top Punti di Forza</h3>
        <canvas id="chart-s"></canvas>
        <div id="chart-s-empty" class="empty-chart" style="display:none;">Nessun dato</div>
      </div>
      <div class="chart-card">
        <h3 class="red">🔴 Top Punti di Debolezza</h3>
        <canvas id="chart-w"></canvas>
        <div id="chart-w-empty" class="empty-chart" style="display:none;">Nessun dato</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📋 Storico Segnalazioni</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data e ora</th>
              <th>Punti di Forza</th>
              <th>Punti di Debolezza</th>
              <th>Note</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="log-tbody"></tbody>
        </table>
        <div id="log-empty" class="empty-table" style="display:none;">
          <div class="icon">📋</div>
          <div>Nessuna segnalazione nel periodo selezionato.</div>
        </div>
      </div>
    </div>
  `;
  renderDashboard();
}

// ─── FILTER ───────────────────────────────────────────────────
function onFilterChange() {
  const period = document.getElementById('filter-period').value;
  document.getElementById('date-range').style.display =
    period === 'custom' ? 'flex' : 'none';
  renderDashboard();
}

function getFiltered() {
  const period = document.getElementById('filter-period')?.value || 'all';
  if (period === 'all') return allEntries;
  if (period === 'custom') {
    const from = document.getElementById('filter-from').value;
    const to   = document.getElementById('filter-to').value;
    return allEntries.filter(e => {
      const d = e.created_at.slice(0, 10);
      return (!from || d >= from) && (!to || d <= to);
    });
  }
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - parseInt(period));
  return allEntries.filter(e => new Date(e.created_at) >= cutoff);
}

// ─── RENDER DASHBOARD ─────────────────────────────────────────
function renderDashboard() {
  const entries = getFiltered();
  document.getElementById('stat-tot').textContent = entries.length;
  document.getElementById('stat-s').textContent   = entries.reduce((n,e) => n+(e.strengths||[]).length, 0);
  document.getElementById('stat-w').textContent   = entries.reduce((n,e) => n+(e.weaknesses||[]).length, 0);
  renderChart('chart-s','chart-s-empty', count(entries,'strengths'),  'rgba(46,204,113,0.7)', 'rgba(46,204,113,1)', 'S');
  renderChart('chart-w','chart-w-empty', count(entries,'weaknesses'), 'rgba(231,76,60,0.65)', 'rgba(231,76,60,1)', 'W');
  renderTable(entries);
}

function count(entries, field) {
  const m = {};
  entries.forEach(e => (e[field]||[]).forEach(x => { m[x] = (m[x]||0)+1; }));
  return Object.entries(m).sort((a,b) => b[1]-a[1]);
}

function renderChart(canvasId, emptyId, data, bg, border, key) {
  const canvas = document.getElementById(canvasId);
  const empty  = document.getElementById(emptyId);
  const top    = data.slice(0, 8);
  if (top.length === 0) {
    canvas.style.display = 'none'; empty.style.display = 'flex'; return;
  }
  canvas.style.display = 'block'; empty.style.display = 'none';
  if (key === 'S' && chartS) { chartS.destroy(); chartS = null; }
  if (key === 'W' && chartW) { chartW.destroy(); chartW = null; }
  const ch = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: top.map(([k]) => k.length > 30 ? k.slice(0,28)+'…' : k),
      datasets: [{ data: top.map(([,v]) => v), backgroundColor: bg, borderColor: border, borderWidth: 1.5, borderRadius: 6 }],
    },
    options: {
      indexAxis: 'y', responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#f0f2f5' } },
        y: { grid: { display: false } },
      },
    },
  });
  if (key === 'S') chartS = ch; else chartW = ch;
}

function renderTable(entries) {
  const tbody = document.getElementById('log-tbody');
  const empty = document.getElementById('log-empty');
  if (entries.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  tbody.innerHTML = entries.map(e => `
    <tr>
      <td style="white-space:nowrap;color:var(--gray);">${fmtDate(e.created_at)}</td>
      <td>${(e.strengths||[]).map(s=>`<span class="badge badge-green">${esc(s)}</span>`).join('')||dash()}</td>
      <td>${(e.weaknesses||[]).map(w=>`<span class="badge badge-red">${esc(w)}</span>`).join('')||dash()}</td>
      <td style="max-width:200px;font-size:0.84rem;color:var(--gray);">${esc(e.note||'')}</td>
      <td><button class="btn-del" title="Elimina" onclick="deleteEntry('${e.id}')">🗑</button></td>
    </tr>
  `).join('');
}

// ─── DELETE ENTRY ─────────────────────────────────────────────
async function deleteEntry(id) {
  if (!confirm('Eliminare questa segnalazione?')) return;
  const { error } = await db.from('entries').delete().eq('id', id);
  if (error) { showToast('Errore nell\'eliminazione.', 'error'); return; }
  allEntries = allEntries.filter(e => String(e.id) !== String(id));
  renderDashboard();
  showToast('Segnalazione eliminata.', 'success');
}

// ─── EXPORT CSV ───────────────────────────────────────────────
function exportCSV() {
  const entries = getFiltered();
  if (entries.length === 0) { showToast('Nessun dato da esportare.', 'error'); return; }
  const rows = [['Data e ora','Punti di Forza','Punti di Debolezza','Note']];
  entries.forEach(e => rows.push([
    fmtDate(e.created_at),
    (e.strengths||[]).join(' | '),
    (e.weaknesses||[]).join(' | '),
    e.note || '',
  ]));
  const csv  = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const a    = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `sw-studio_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('CSV esportato!', 'success');
}

// ─── CATEGORIE ────────────────────────────────────────────────
function renderCategories() {
  renderCatList('strength');
  renderCatList('weakness');
}

function renderCatList(type) {
  const items = allCategories.filter(c => c.type === type);
  const list  = document.getElementById('cat-list-' + type);
  const count = document.getElementById('count-' + type);
  count.textContent = items.length;

  if (items.length === 0) {
    list.innerHTML = `<div style="color:var(--gray);font-size:0.85rem;padding:8px 0;">Nessuna categoria. Aggiungine una.</div>`;
    return;
  }
  const cls = type === 'strength' ? 'green-item' : 'red-item';
  list.innerHTML = items.map(c => `
    <div class="cat-item ${cls}">
      <span>${esc(c.label)}</span>
      <button class="btn-cat-del" title="Elimina" onclick="deleteCategory(${c.id}, '${type}')">✕</button>
    </div>
  `).join('');
}

async function addCategory(type) {
  const inp = document.getElementById('cat-input-' + type);
  const val = inp.value.trim();
  if (!val) return;

  // Controlla duplicati
  if (allCategories.some(c => c.type === type && c.label.toLowerCase() === val.toLowerCase())) {
    showToast('Categoria già esistente.', 'error'); return;
  }

  const nextOrder = allCategories.filter(c => c.type === type).length + 1;
  const { data, error } = await db
    .from('categories')
    .insert({ type, label: val, sort_order: nextOrder })
    .select()
    .single();

  if (error) { showToast('Errore nell\'aggiunta.', 'error'); return; }
  allCategories.push(data);
  inp.value = '';
  renderCatList(type);
  showToast('Categoria aggiunta!', 'success');
}

async function deleteCategory(id, type) {
  const cat = allCategories.find(c => c.id === id);
  if (!confirm(`Eliminare la categoria "${cat?.label}"?`)) return;
  const { error } = await db.from('categories').delete().eq('id', id);
  if (error) { showToast('Errore nell\'eliminazione.', 'error'); return; }
  allCategories = allCategories.filter(c => c.id !== id);
  renderCatList(type);
  showToast('Categoria eliminata.', 'success');
}

// ─── UTILS ────────────────────────────────────────────────────
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', {day:'2-digit',month:'2-digit',year:'numeric'})
    + ' ' + d.toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit'});
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function dash() { return '<span style="color:var(--gray);font-size:0.82rem;">—</span>'; }
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
